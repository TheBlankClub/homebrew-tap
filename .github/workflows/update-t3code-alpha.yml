name: Update T3 Code Alpha

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: update-t3code-alpha
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    name: Update and audit cask
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test updater
        run: node --test scripts/update-t3code-alpha-cask.test.mjs

      - id: update
        name: Update cask from latest complete Alpha prerelease
        run: node scripts/update-t3code-alpha-cask.mjs

      - name: Prepare updated cask commit
        if: steps.update.outputs.changed == 'true'
        env:
          ALPHA_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/t3code-alpha.rb
          git commit -m "chore: update t3code-alpha to $ALPHA_VERSION"

      - name: Audit updated cask
        if: steps.update.outputs.changed == 'true'
        run: |
          ruby -c Casks/t3code-alpha.rb
          brew style Casks/t3code-alpha.rb
          brew tap theblankclub/tap "$GITHUB_WORKSPACE"
          brew audit --cask --strict theblankclub/tap/t3code-alpha

      - name: Publish updated cask
        if: steps.update.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Queue independent cask verification
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
